method_id: CMDistill-PAPER-RECONSTRUCTED-VEDAI-fold01-v1
method_identity: PAPER-RECONSTRUCTED
dataset: vedai-official-fold01
student_modality: rgb
privileged_modality: infrared
expected_nc: 8
evaluation_role: development_val

# Paper-reconstructed protocol. The public paper defines the optimizer family,
# input size and core losses, but does not uniquely close every YOLO11 mapping.
# Non-unique choices remain explicit in the run receipt and are not called exact.
model: /mnt/dataset/yudongfang/projects/SpaceNet6_OTD_official_reproduction/artifacts/int8_cross_modal_stage2_v1/weights/yolo11n.pt
imgsz: 640
epochs: 200
workers: 8
batch: 64
nbs: 64
optimizer: SGD
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
cos_lr: true
close_mosaic: 10
patience: 0
amp: true
deterministic: true
allowed_seeds: [0, 42, 123]

augmentation:
  mosaic: 0.0
  mixup: 0.0
  cutmix: 0.0
  degrees: 0.0
  perspective: 0.0
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  flipud: 0.0
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  erasing: 0.0

paths:
  student_data_yaml: /mnt/dataset/yudongfang/projects/RGBT_campaign/cmdistill_native/data/processed/VEDAI512_paper8_hbb_official_fold01/configs/vedai512_rgb_hbb.yaml
  privileged_data_yaml: /mnt/dataset/yudongfang/projects/RGBT_campaign/cmdistill_native/data/processed/VEDAI512_paper8_hbb_official_fold01/configs/vedai512_ir_hbb.yaml
  paired_train_mapping: /mnt/dataset/yudongfang/projects/RGBT_campaign/cmdistill_native/data/contracts/VEDAI512_official_fold01/paired_train_20260904.json
  paired_val_mapping: /mnt/dataset/yudongfang/projects/RGBT_campaign/cmdistill_native/data/contracts/VEDAI512_official_fold01/paired_test_20260904.json
  preparation_receipt: /mnt/dataset/yudongfang/projects/RGBT_campaign/cmdistill_native/data/processed/VEDAI512_paper8_hbb_official_fold01/metadata/prepare_manifest.json
